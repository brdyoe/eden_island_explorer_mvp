<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Eden Island Explorer Academy</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f5f7f3; }
    #bootStatus { max-width: 760px; margin: 30px auto; padding: 18px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17211b; }
  </style>
</head>
<body>
  <div id="bootStatus">Loading Eden Island Explorer…</div>
  <script>
    (async () => {
      try {
        const [baseResponse, packResponse] = await Promise.all([
          fetch('/index.html?base=20260728-3', {cache: 'no-store'}),
          fetch('/content-update.js?pack=20260728-3', {cache: 'no-store'})
        ]);
        if (!baseResponse.ok) throw new Error(`Base app returned ${baseResponse.status}`);
        if (!packResponse.ok) throw new Error(`Content pack returned ${packResponse.status}`);

        let html = await baseResponse.text();
        const packSource = (await packResponse.text()).replace(/<\/script/gi, '<\\/script');
        const verificationSource = `
          try {
            const cartographer = badges.find(b => b.id === 'navigator');
            const collector = badges.find(b => b.id === 'pokemon_master');
            const loaded = cartographer?.name === 'Cartographer' && collector?.name === 'Pokémon Collector';
            document.documentElement.dataset.contentPack = loaded ? 'v2' : 'failed';
            if (!loaded) {
              const note = document.createElement('div');
              note.className = 'safety danger';
              note.style.margin = '12px 14px';
              note.innerHTML = '<b>Content update did not load.</b> Cartographer or Pokémon Collector is missing.';
              document.body.prepend(note);
            }
          } catch (error) {
            console.error('Content pack verification failed', error);
          }
        `;
        const inlinePack = `<script id="contentPackV2">${packSource}<\/script><script>${verificationSource}<\/script>`;

        if (!html.includes('</body>')) throw new Error('Base app HTML has no closing body tag');
        html = html.replace('</body>', `${inlinePack}</body>`);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('bootStatus').innerHTML = `<b>App failed to start.</b><br>${String(error.message || error)}`;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
