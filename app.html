<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Eden Island Explorer Academy</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f5f7f3; }
    #bootStatus { max-width: 760px; margin: 30px auto; padding: 18px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17211b; }
  </style>
</head>
<body>
  <div id="bootStatus">Loading Eden Island Explorer…</div>
  <script>
    (async () => {
      try {
        const response = await fetch('/index.html?base=20260728', {cache: 'no-store'});
        if (!response.ok) throw new Error(`Base app returned ${response.status}`);
        let html = await response.text();
        const loader = `
          <script src="/content-update.js?v=20260728-2"><\/script>
          <script>
            try {
              const cartographer = badges.find(b => b.id === 'navigator');
              const loaded = cartographer && cartographer.name === 'Cartographer';
              document.documentElement.dataset.contentPack = loaded ? 'v2' : 'failed';
              if (!loaded) {
                const note = document.createElement('div');
                note.className = 'safety danger';
                note.style.margin = '12px 14px';
                note.innerHTML = '<b>Content update did not load.</b> Please report this screen.';
                document.body.prepend(note);
              }
            } catch (error) {
              console.error('Content pack verification failed', error);
            }
          <\/script>`;
        if (!html.includes('</body>')) throw new Error('Base app HTML has no closing body tag');
        html = html.replace('</body>', `${loader}</body>`);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('bootStatus').innerHTML = `<b>App failed to start.</b><br>${String(error.message || error)}`;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
