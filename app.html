<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Eden Island Explorer Academy</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f7f3; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="/index.html" title="Eden Island Explorer Academy"></iframe>
  <script>
    const frame = document.getElementById('appFrame');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc || doc.getElementById('contentPackV2')) return;
      const script = doc.createElement('script');
      script.id = 'contentPackV2';
      script.src = '/content-update.js?v=2';
      doc.body.appendChild(script);
    });
  </script>
</body>
</html>
