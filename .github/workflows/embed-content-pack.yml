name: Embed Content Pack v2

on:
  push:
    branches:
      - main
    paths:
      - content-update.js
      - build.cjs
      - .github/workflows/embed-content-pack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-static-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Embed content pack into static HTML
        run: node build.cjs

      - name: Commit generated HTML
        run: |
          if git diff --quiet -- index.html app.html; then
            echo "Generated HTML is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html
          git commit -m "Generate static app with Content Pack v2"
          git push origin HEAD:main
